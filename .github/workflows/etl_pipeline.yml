name: Automated Job Tracker ETL

on:
  schedule:
    # Runs every 8 hours. Adjust the cron timing if you want it more/less frequent.
    - cron: '0 */8 * * *'
  workflow_dispatch: # This line adds a button in GitHub so you can test it manually

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth gspread google-genai python-dotenv

    - name: Inject token.json from GitHub Secrets
      env:
        TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      run: echo "$TOKEN_JSON" > token.json

    - name: Execute ETL Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py