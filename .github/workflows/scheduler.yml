name: Job Tracker ETL Pipeline

on:
  schedule:
    - cron: '0 8,14,20 * * *' # Runs at 8:00 AM, 2:00 PM, and 8:00 PM UTC daily
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib gspread google-genai

      - name: Recreate token file from secrets
        run: |
          echo '${{ secrets.GCP_TOKEN }}' > token.json

      - name: Run ETL Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py